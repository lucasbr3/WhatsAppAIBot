<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp AI Bot - Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f23; color: #e0e0e0; min-height: 100vh; }
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #1a1a3e; padding: 40px; border-radius: 16px; width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .login-box h1 { text-align: center; margin-bottom: 24px; font-size: 24px; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #333; border-radius: 8px; background: #0f0f23; color: #e0e0e0; font-size: 14px; }
    .login-box button { width: 100%; padding: 12px; background: #25D366; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    .login-box button:hover { background: #1da851; }
    #dashboard { display: none; min-height: 100vh; }
    .sidebar { width: 220px; background: #1a1a3e; padding: 20px; display: flex; flex-direction: column; }
    .sidebar h2 { font-size: 16px; margin-bottom: 24px; color: #25D366; }
    .nav-btn { display: block; width: 100%; padding: 10px 16px; margin-bottom: 4px; background: none; border: none; color: #a0a0c0; text-align: left; cursor: pointer; border-radius: 8px; font-size: 14px; }
    .nav-btn:hover, .nav-btn.active { background: #2a2a5e; color: #e0e0e0; }
    .nav-btn.logout { margin-top: auto; color: #ff4444; }
    .nav-btn.logout:hover { background: #3a1a1a; }
    .main { flex: 1; padding: 24px; overflow-y: auto; max-height: 100vh; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #1a1a3e; padding: 20px; border-radius: 12px; }
    .card h3 { font-size: 12px; color: #8888aa; text-transform: uppercase; margin-bottom: 8px; }
    .card .value { font-size: 28px; font-weight: bold; }
    .status-connected { color: #25D366; }
    .status-disconnected { color: #ff4444; }
    .status-connecting { color: #ffaa00; }
    .player-controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .player-controls button { padding: 8px 16px; border: 1px solid #333; border-radius: 8px; background: #2a2a5e; color: #e0e0e0; cursor: pointer; font-size: 13px; }
    .player-controls button:hover { background: #3a3a7e; }
    .tab-content { display: none; }
    #tab-overview { display: block; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a2a5e; font-size: 13px; }
    th { color: #8888aa; font-size: 11px; text-transform: uppercase; }
    #logs { height: 300px; overflow-y: auto; background: #0a0a1a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #1a1a3e; }
    #qr-code pre { background: #0a0a1a; padding: 16px; border-radius: 8px; font-size: 11px; line-height: 1.2; overflow-x: auto; }
    @media (max-width: 768px) { .sidebar { width: 100%; padding: 12px; } #dashboard { flex-direction: column; } .main { max-height: none; } }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-box">
      <h1>🤖 WhatsApp AI Bot</h1>
      <input type="text" id="username" placeholder="Usuário" value="admin" />
      <input type="password" id="password" placeholder="Senha" onkeydown="if(event.key==='Enter') login()" />
      <button onclick="login()">Entrar</button>
    </div>
  </div>

  <div id="dashboard">
    <div class="sidebar">
      <h2>🤖 WA AI Bot</h2>
      <button class="nav-btn active" onclick="showTab('overview')">📊 Visão Geral</button>
      <button class="nav-btn" onclick="showTab('users')">👥 Usuários</button>
      <button class="nav-btn" onclick="showTab('calls')">📞 Chamadas</button>
      <button class="nav-btn" onclick="showTab('logs')">📋 Logs</button>
      <button class="nav-btn logout" onclick="logout()">Sair</button>
    </div>
    <div class="main">
      <div id="tab-overview" class="tab-content">
        <div class="cards">
          <div class="card"><h3>Status do Bot</h3><div class="value"><span id="bot-status" class="status-disconnected">desconectado</span></div></div>
          <div class="card"><h3>Usuários</h3><div class="value" id="users-count">0</div></div>
          <div class="card"><h3>Tocando Agora</h3><div class="value" id="now-playing" style="font-size:16px">Nenhuma</div></div>
          <div class="card"><h3>Fila</h3><div class="value" id="queue-size">0</div></div>
          <div class="card"><h3>Volume</h3><div class="value" id="volume-display">80%</div></div>
        </div>
        <div class="card">
          <h3>🎵 Controle de Música</h3>
          <div class="player-controls">
            <button onclick="controlPlayer('pause')">⏸️ Pausar</button>
            <button onclick="controlPlayer('resume')">▶️ Continuar</button>
            <button onclick="controlPlayer('skip')">⏭️ Pular</button>
            <button onclick="controlPlayer('stop')">⏹️ Parar</button>
            <button onclick="controlPlayer('volume', Math.max(0, parseInt(document.getElementById('volume-display').textContent) - 10))">🔉 Vol-</button>
            <button onclick="controlPlayer('volume', Math.min(100, parseInt(document.getElementById('volume-display').textContent) + 10))">🔊 Vol+</button>
          </div>
        </div>
        <div id="qr-code" class="card" style="margin-top:16px"><h3>📱 QR Code</h3><p style="margin-top:8px;color:#8888aa">Aguardando conexão...</p></div>
      </div>

      <div id="tab-users" class="tab-content">
        <div class="card"><h3>👥 Usuários</h3><div style="overflow-x:auto;margin-top:12px"><table id="users-table"><thead><tr><th>Nome</th><th>ID</th><th>Mensagens</th><th>Última Vez</th></tr></thead><tbody></tbody></table></div></div>
      </div>

      <div id="tab-calls" class="tab-content">
        <div class="card"><h3>📞 Chamadas</h3><div style="overflow-x:auto;margin-top:12px"><table id="calls-table"><thead><tr><th>Usuário</th><th>Direção</th><th>Duração</th><th>Status</th><th>Data</th></tr></thead><tbody></tbody></table></div></div>
      </div>

      <div id="tab-logs" class="tab-content">
        <div class="card"><h3>📋 Logs do Sistema</h3><div id="logs" style="margin-top:12px"></div></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
